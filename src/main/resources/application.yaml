server:
  port: ${PORT:8080}
  # Atrás do proxy do host (Render etc.): usa o IP real do cliente do X-Forwarded-For
  forward-headers-strategy: native

spring:
  application:
    name: appSaudeBackEnd
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  login:
    max-tentativas-conta: ${LOGIN_MAX_TENTATIVAS_CONTA:5}
    max-tentativas-ip: ${LOGIN_MAX_TENTATIVAS_IP:30}
    janela-minutos: ${LOGIN_JANELA_MINUTOS:15}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}