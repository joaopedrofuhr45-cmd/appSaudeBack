spring:
  application:
    name: appSaudeBackEnd
  datasource:
    url: jdbc:h2:file:./data/appsaude
    driver-class-name: org.h2.Driver
    username: sim
    password: sim
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  jwt:
      secret: ${JWT_SECRET:uma-chave-secreta-soh-para-desenvolvimento-local}
      expiration: 86400000