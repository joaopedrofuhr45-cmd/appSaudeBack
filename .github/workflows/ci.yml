name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # JWT_SECRET não tem valor padrão no application.yaml e o JwtService decodifica como Base64,
      # então aqui vai um valor Base64 só de teste (não é um segredo real).
      - name: Rodar testes
        env:
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdGluZy0zMi1ieXRlcw==
        run: ./mvnw -B -ntp verify
