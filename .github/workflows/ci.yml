name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # JWT_SECRET não tem valor padrão no application.yaml; aqui vai um valor só de teste.
      - name: Rodar testes
        env:
          JWT_SECRET: segredo-so-para-testes-no-ci-com-mais-de-32-caracteres
        run: ./mvnw -B -ntp verify
